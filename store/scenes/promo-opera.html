<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 300px; height: 188px; overflow: hidden; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: #eef2f6; color: #1c1c1a;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 14px;
}
.icon { width: 44px; height: 44px; border-radius: 10px; background: #0C447C;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; margin-bottom: 10px; }
.icon .t { width: 24px; height: 4px; background: #fff; border-radius: 1px; }
.icon .u { width: 24px; height: 6px; border-radius: 1px;
  background: linear-gradient(90deg,#639922 0 25%,#E24B4A 25% 50%,#EF9F27 50% 75%,#378ADD 75% 100%); }
h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
p { font-size: 11px; color: #5f5e5a; margin-top: 4px; }
.chips { display: flex; gap: 5px; margin-top: 11px; }
.chip { font-size: 9px; font-weight: 600; padding: 2px 6px; border-radius: 9px; border: 1px solid; }
.c1 { color:#3B6D11; background:#EAF3DE; border-color:#639922; }
.c2 { color:#A32D2D; background:#FCEBEB; border-color:#E24B4A; }
.c3 { color:#854F0B; background:#FAEEDA; border-color:#EF9F27; }
.c4 { color:#0C447C; background:#E6F1FB; border-color:#378ADD; }
</style>
</head>
<body>
  <div class="icon"><span class="t"></span><span class="u"></span></div>
  <h1>Nofollow Highlighter</h1>
  <p>See a page's link profile at a glance</p>
  <div class="chips">
    <span class="chip c1">dofollow</span>
    <span class="chip c2">nofollow</span>
    <span class="chip c3">sponsored</span>
    <span class="chip c4">ugc</span>
  </div>
</body>
</html>
